# Melintir local test stack: WordPress + MariaDB, plugin mounted live.
#
# Usage:
#   docker compose up -d        # boots db + wordpress, auto-installs WP + activates Melintir
#   docker compose logs -f      # watch progress
#   open http://localhost:8082  # admin: admin / melintir-dev (change after first login)
#   docker compose down         # stop (data kept in volumes)
#   docker compose down -v      # stop + wipe DB and WP files
#
# The repo root is mounted as wp-content/plugins/melintir, so after you
# rebuild (`make all` on the host) just refresh the browser — no copy step.
# Host ports: WordPress :8080 (host nginx already owns :80).

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: melintir-root-dev
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress-dev
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    image: wordpress:6.8-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-dev
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/melintir

  # One-shot setup: waits for the wordpress entrypoint, installs WP if needed,
  # activates Melintir. Exits 0 when done — that is normal, not a crash.
  wpcli:
    image: wordpress:cli-2-php8.3
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-dev
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/melintir
    working_dir: /var/www/html
    entrypoint:
      - sh
      - -c
      - |
        until [ -f /var/www/html/wp-config.php ]; do sleep 3; done
        sleep 5
        if ! wp core is-installed --allow-root; then
          wp core install --allow-root --url=http://localhost:8082 --title=MelintirDev \
            --admin_user=admin --admin_password=melintir-dev \
            --admin_email=admin@example.com --skip-email
        fi
        wp plugin activate melintir --allow-root || true
        wp plugin list --allow-root

volumes:
  db_data:
  wp_data:
